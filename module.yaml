# The manifest the prusa-connect server reads when it installs this module.
#
# It names no namespace: the server derives it from the module path the
# operator installs, github.com/denhac/prusa-connect-local-bot, which gives
# com.github.aux.denhac.prusa-connect-local-bot.
#
# manifest_test.go holds this file to the code: the name and version to
# internal/app, the options to internal/settings, and the routes to
# openapi.json.
#
# Each phase asks only for what it uses (docs/design.md, "Phases and
# milestones"). A request added later is approved again at that update.

name: slack-bot
title: Slack bot
summary: Posts printer status to Slack, and lets denhac members manage their account with /prusaconnect.
codeowner: denhac
kind: sink
version: 0.10.0
license: MIT
contract_major: 1
openapi: openapi.json

# The core release this was built against, and the wire methods it calls.
require:
  core: ">=0.1.0-beta.2 <0.2.0"
  core-device.list: "*"
  core-device.jobs: "*"
  core-device.job_history: "*"
  core-bus.subscribe: "*"
  core-access.check: "*"

# What the module does as itself: it reads the printers and follows their
# events, for the status messages and the status, jobs and bot commands.
permissions:
  - observe

# Before an admin command, the module asks the server whether the person's
# linked account administers the server's accounts. Those people are not on a
# request of the module's, so the question needs check_absent_people.
checks:
  - configure_resource
check_absent_people: true

needs:
  # Where the module keeps its state file, state.json.
  data: true

# Every connection outside the server.
egress:
  - host: slack.com
    from: process
    why: The Slack Web API, and opening the Socket Mode connection.
    sends: Command answers and status messages.
  - host: "*.slack.com"
    from: process
    why: The Socket Mode WebSocket, and answers to commands through response_url.
    sends: Acknowledgements and command answers.
  - option: server_url
    ports: [8080]
    from: process
    why: Signs in as the bot's own account, to read camera pictures and to create and change members' accounts.
    sends: The bot account's name and password, then camera and account requests.
  - host: denhac.org
    from: process
    why: Reads a member's public status page, to check that they may have an account.
    sends: The member code.

# Every setting is optional: a required one left empty would make the server
# refuse the install. The module runs idle and lists what is missing instead.
options:
  - key: slack_bot_token
    type: secret
    default: ""
    summary: The Slack app's bot token, starting xoxb-.
  - key: slack_app_token
    type: secret
    default: ""
    summary: The Slack app's app-level token for Socket Mode, starting xapp-, with the scope connections:write.
  - key: status_channel
    type: string
    default: ""
    summary: The ID of the channel that status goes to (#bots), such as C0123ABCD.
  - key: allow_guests
    type: bool
    default: "false"
    summary: Whether Slack guest accounts may use /prusaconnect.
  - key: cameras
    type: object
    default: "{}"
    summary: Each printer's Pi camera still address, by printer id, such as {"<printer id>":"http://<Pi LAN address>:8555/v1/cameras/cam0/still"}. LAN addresses only.
  - key: issue_reasons
    type: list
    default: '["awaiting_operator"]'
    summary: The server's issue reasons that mean a printer needs a person, posted to the status channel.
  - key: server_url
    type: url
    default: "http://127.0.0.1:8080"
    summary: Where the bot signs in to the server's API. Plain http only to loopback, and never a Tailscale address.
  - key: admin_username
    type: string
    default: "slackbot"
    summary: The bot's own account on the server.
  - key: admin_password
    type: secret
    default: ""
    summary: That account's password. Empty turns off what needs a sign-in, such as camera stills and account features.
  - key: public_url
    type: url
    default: ""
    summary: Where people open the printer server in a browser, for the link page. Never a Tailscale address.
  - key: verify
    type: object
    default: '{"member_field":"Member","code_field":"Member Code URL","member_url":"https://denhac.org/member/","authorization":"3D Printer User"}'
    summary: Where the membership facts are - the two Slack profile fields, the member page address, and the authorization an account needs.
  - key: sweep_interval
    type: duration
    default: "24h"
    summary: How often every member's page is checked, such as 24h for daily or 720h for about monthly. 0 turns the sweep off.
  - key: sweep_max_changes
    type: int
    default: "5"
    summary: The most accounts the sweep turns off, and the most it deletes, in any 24 hours. 0 changes nothing and only reports.
  - key: delete_after
    type: duration
    default: "2160h"
    summary: How long an account stays off for a lapsed membership before it is deleted (2160h is 90 days). 0 never deletes.

platforms:
  - linux_arm64
  - linux_amd64
